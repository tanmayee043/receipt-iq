name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # --check fails the build instead of rewriting files
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: pytest
