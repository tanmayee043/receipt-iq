name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://receipt_iq:receipt_iq@127.0.0.1:5432/receipt_iq
      REDIS_URL: redis://127.0.0.1:6379
    # Tests use a real Postgres, so they also check the migrations, and a real Redis for
    # login sessions and rate limits.
    services:
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: receipt_iq
          POSTGRES_PASSWORD: receipt_iq
          POSTGRES_DB: receipt_iq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receipt_iq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # --check fails the build instead of rewriting files
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests scripts
      - run: pytest
