services:
  redis:
    image: redis:7.4.12-alpine
    # Saved to disk, so queued receipts survive a Redis restart.
    command: redis-server --appendonly yes
    ports:
      # This machine only: Redis has no password here.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: receipt_iq
      # A local development password. The port below is only open to this machine.
      POSTGRES_PASSWORD: receipt_iq
      POSTGRES_DB: receipt_iq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt_iq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
