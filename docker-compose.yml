services:
  redis:
    image: redis:7-alpine
    # Saved to disk, so queued receipts survive a Redis restart.
    command: redis-server --appendonly yes
    ports:
      # This machine only: Redis has no password here.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
